    const ws=s.split(/\W+/).filter(w=>w.length>2);if(!ws.length)ws.push(s);const need=Math.max(1,Math.ceil(ws.length*.6)),hits=[];
    tx.forEach((t,i)=>(t.match(/[^.?!]+[.?!]?/g)||[]).forEach(z=>{const l=z.toLowerCase();let sc=ws.filter(w=>l.includes(w)).length;if(sc<need)return;if(l.includes(s))sc+=5;hits.push({n:i+1,z:z.trim(),sc})}));
    hits.sort((a,b)=>b.sc-a.sc||a.n-b.n);const top=hits.slice(0,40);
    R.innerHTML=top.length?top.map(h=>{let z=esc(h.z.slice(0,260));ws.forEach(w=>z=z.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>'<mark>'+m+'</mark>'));return '<div class="row" data-g="'+h.n+'"><div>'+z+'<br><small>Page '+h.n+'</small></div></div>'}).join(''):'No match. Scanned PDFs (images) cannot be searched.';
    R.onclick=ev=>{const g=ev.target.closest('[data-g]');if(g){cl();go(p,+g.dataset.g)}}}})}
function grid(p){ov('All pages',c=>{
  c.innerHTML='<div class="th">'+Array.from({length:p.pages},(_,i)=>'<div data-g="'+(i+1)+'" style="'+(i+1==p.n?'outline:2px solid var(--ac)':'')+'"><span class="tc"></span>'+(i+1)+(p.meta.bm.includes(i+1)?' ★':'')+'</div>').join('')+'</div>';
  c.onclick=e=>{const g=e.target.closest('[data-g]');if(g){cl();go(p,+g.dataset.g)}};
  const io=new IntersectionObserver(es=>es.forEach(async en=>{if(!en.isIntersecting)return;io.unobserve(en.target);const i=+en.target.dataset.g,h=$('.tc',en.target);
    if(p.kind=='pdf'){const key='th_'+p.meta.id+'_'+i;try{let u=(p.thc&&p.thc[key])||await P('files','get',key);if(typeof u!='string'){const pg=await p.pdf.getPage(i),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:150/v0.width}),cv=document.createElement('canvas');cv.width=v.width;cv.height=v.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;u=cv.toDataURL('image/jpeg',.6);P('files','put',u,key)}(p.thc=p.thc||{})[key]=u;const im=new Image();im.src=u;h.appendChild(im)}catch(x){}}
    else h.innerHTML='<div style="font-size:10px;text-align:left;max-height:90px;overflow:hidden;color:var(--mu)">'+esc(p.html[i-1].replace(/<[^>]*>/g,' ').slice(0,120))+'</div>'}),{root:c});
  c.querySelectorAll('.th>div').forEach(d=>io.observe(d));
  const cur=c.querySelector('[data-g="'+p.n+'"]');cur&&cur.scrollIntoView({block:'center'})})}
async function dl(name,data){const d=window.claude?await window.claude.use('downloads'):null;if(!d){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;document.body.appendChild(a);a.click();a.remove();return}try{await d.save({filename:name,data})}catch(e){if(e.code!='declined')alert('Could not save ('+(e.code||e.message)+')')}}
async function backup(full){const R=$('#bm2');R.textContent='Preparing…';await loadLib();
  const info={v:1,books:S.lib,goal:LS.g('goal',20),days:LS.g('days',{})},date=new Date().toISOString().slice(0,10);
  if(!full){R.textContent='';return dl('reader-notes-'+date+'.json',JSON.stringify(info))}
  const z=new JSZip();z.file('meta.json',JSON.stringify(info));
  for(const m of S.lib){const f=await P('files','get',m.id);if(f)z.file('files/'+m.id,f)}
  const b=await z.generateAsync({type:'blob',compression:'STORE'},x=>R.textContent='Packing '+Math.round(x.percent)+'%');R.textContent='';
  return dl('reader-backup-'+date+'.zip',b)}
async function restore(f){const R=$('#bm2');R.textContent='Restoring…';
  try{let info,z;if(ext(f.name)=='zip'){z=await JSZip.loadAsync(f);info=JSON.parse(await z.file('meta.json').async('string'))}else info=JSON.parse(await f.text());
  await loadLib();let add=0,mer=0;
  for(const m of info.books||[]){const ex=S.lib.find(x=>x.id==m.id)||(!z&&S.lib.find(x=>x.name==m.name));
    if(ex){ex.bm=[...new Set([...(ex.bm||[]),...(m.bm||[])])].sort((a,b)=>a-b);const have=new Set(ex.hl.map(h=>h.n+h.t));(m.hl||[]).forEach(h=>{if(!have.has(h.n+h.t))ex.hl.push(h)});ex.ink=ex.ink||[];(m.ink||[]).forEach(k=>{if(!ex.ink.some(z=>z.id==k.id))ex.ink.push(k)});if((m.opened||0)>(ex.opened||0)){ex.last=m.last;ex.opened=m.opened}ex.fav=ex.fav||m.fav;ex.col=ex.col||m.col;ex.sec=Math.max(ex.sec||0,m.sec||0);await P('meta','put',ex);mer++}
    else if(z&&z.file('files/'+m.id)){await P('files','put',await z.file('files/'+m.id).async('blob'),m.id);await P('meta','put',m);add++}}
  if(info.goal)LS.s('goal',info.goal);const dd=LS.g('days',{});for(const k in info.days||{})dd[k]=Math.max(dd[k]||0,info.days[k]);LS.s('days',dd);
  R.textContent='Done: '+add+' books added, '+mer+' updated.';loadLib()}catch(x){R.textContent='Could not read this backup file.'}}
$('#bk').onclick=()=>ov('Backup and restore',c=>{
  c.innerHTML=driveUI()+'<p>Save a backup file, then upload it to Google Drive from your phone. To restore (on this or a new phone), choose that file from Drive.</p><p><button class="add" data-k="zip">⬇ Backup with books (ZIP)</button></p><p><button class="add" data-k="json">⬇ Notes only (small file)</button></p><p><button class="add" data-k="rs">⬆ Restore from file</button></p><div id="bm2" style="color:var(--mu)"></div><input type="file" id="rf" accept=".zip,.json" hidden>';
  $('#rf').onchange=e=>{const f=e.target.files[0];e.target.value='';f&&restore(f)};
  c.onclick=e=>{const k=e.target.dataset.k;if(k=='zip')backup(true);else if(k=='json')backup(false);else if(k=='rs')$('#rf').click();else if(k=='gsync')gdo()}});

const G={tok:null,exp:0,cli:null,cid:'',busy:0};
const GS='https://www.googleapis.com/drive/v3/files',GU='https://www.googleapis.com/upload/drive/v3/files';
function driveUI(){return '<div class="row" style="display:block;cursor:default"><b>\u2601 Google Drive sync</b><p><small>Saves your books, notes and reading position in a hidden app folder in your own Drive. Other Drive files are never touched.</small></p><input type="text" id="cid" placeholder="Paste Google Client ID" value="'+esc(LS.g('cid',''))+'"><p><button class="add" data-k="gsync">Sign in and sync now</button></p><small id="gst">'+(G.tok?'Signed in':'Not signed in')+'</small></div>'}
function gtoken(inter){return new Promise((res,rej)=>{
  if(G.tok&&Date.now()<G.exp-60000)return res(G.tok);
  const cid=LS.g('cid','');if(!cid)return rej(new Error('Paste your Client ID first'));
  if(!window.google||!google.accounts)return rej(new Error('Google sign-in not loaded. Check internet'));
  if(!G.cli||G.cid!=cid){G.cid=cid;G.cli=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.appdata',
    callback:r=>{if(r.error){G.rej&&G.rej(new Error(r.error))}else{G.tok=r.access_token;G.exp=Date.now()+r.expires_in*1000;LS.s('gok',1);G.res&&G.res(G.tok)}},
    error_callback:e=>G.rej&&G.rej(new Error(e.type||'sign-in cancelled'))})}
  G.res=res;G.rej=rej;G.cli.requestAccessToken({prompt:inter?'consent':''})})}
async function gf(url,opt={}){const t=await gtoken(false);const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});if(!r.ok)throw new Error('Drive error '+r.status);return r}
async function glist(){let out=[],pt='';do{const r=await(await gf(GS+'?spaces=appDataFolder&fields=nextPageToken,files(id,name)&pageSize=1000'+(pt?'&pageToken='+pt:''))).json();out=out.concat(r.files||[]);pt=r.nextPageToken}while(pt);return out}
async function gput(name,blob,fid){
  const meta=fid?{}:{name,parents:['appDataFolder']};
  const r=await gf((fid?GU+'/'+fid:GU)+'?uploadType=resumable',{method:fid?'PATCH':'POST',headers:{'Content-Type':'application/json; charset=UTF-8'},body:JSON.stringify(meta)});
  const loc=r.headers.get('Location');if(!loc)throw new Error('Upload not started');
  const u=await fetch(loc,{method:'PUT',body:blob});if(!u.ok)throw new Error('Upload error '+u.status)}
async function gsync(say,inter){say=say||(()=>{});say('Signing in\u2026');await gtoken(inter);say('Reading Drive\u2026');
  const fl=await glist(),by={};fl.forEach(f=>by[f.name]=f);
  let info={books:[],del:[]};
  if(by['meta.json'])info=await(await gf(GS+'/'+by['meta.json'].id+'?alt=media')).json();
  const del=new Set([...LS.g('del',[]),...(info.del||[])]);LS.s('del',[...del]);
  await loadLib();
  for(const id of del){if(S.lib.find(x=>x.id==id)){await P('files','delete',id);await P('meta','delete',id)}if(by['f_'+id]){await gf(GS+'/'+by['f_'+id].id,{method:'DELETE'});delete by['f_'+id]}}
  await loadLib();
  for(const m of info.books||[]){if(del.has(m.id))continue;const ex=S.lib.find(x=>x.id==m.id);
    if(ex){ex.bm=[...new Set([...(ex.bm||[]),...(m.bm||[])])].sort((a,b)=>a-b);const have=new Set(ex.hl.map(h=>h.n+h.t));(m.hl||[]).forEach(h=>{if(!have.has(h.n+h.t))ex.hl.push(h)});ex.ink=ex.ink||[];(m.ink||[]).forEach(k=>{if(!ex.ink.some(z=>z.id==k.id))ex.ink.push(k)});
      if((m.opened||0)>(ex.opened||0)){ex.last=m.last;ex.opened=m.opened}ex.fav=ex.fav||m.fav;ex.col=ex.col||m.col;ex.sec=Math.max(ex.sec||0,m.sec||0);await P('meta','put',ex)}
    else if(by['f_'+m.id]){say('Downloading '+m.title+'\u2026');const b=await(await gf(GS+'/'+by['f_'+m.id].id+'?alt=media')).blob();await P('files','put',b,m.id);await P('meta','put',m)}}
  if(info.goal)LS.s('goal',info.goal);const dd=LS.g('days',{});for(const k in info.days||{})dd[k]=Math.max(dd[k]||0,info.days[k]);LS.s('days',dd);
  await loadLib();
  for(const m of S.lib){if(!by['f_'+m.id]){say('Uploading '+m.title+'\u2026');const b=await P('files','get',m.id);if(b)await gput('f_'+m.id,b)}}
  say('Saving notes\u2026');
  await gput('meta.json',new Blob([JSON.stringify({v:1,books:S.lib,goal:LS.g('goal',20),days:LS.g('days',{}),del:[...del]})],{type:'application/json'}),by['meta.json']&&by['meta.json'].id)}
async function gdo(){const st=$('#gst'),say=t=>{if(st)st.textContent=t},cid=($('#cid')||{}).value;
  if(!cid||!cid.trim()){say('Paste your Client ID first');return}LS.s('cid',cid.trim());
  try{await gsync(say,true);say('Synced \u2713 '+new Date().toLocaleTimeString());loadLib()}catch(e){say('Failed: '+e.message)}}
async function autoSync(){if(!LS.g('gok',0)||G.busy)return;G.busy=1;
  try{await gsync(null,false);$('#msg').textContent='\u2601 Synced '+new Date().toLocaleTimeString()}catch(e){$('#msg').textContent='\u2601 Sync paused. Open \u2601 and tap Sign in and sync now'}finally{G.busy=0}}
setInterval(()=>{if(G.tok&&Date.now()<G.exp-60000&&!document.hidden&&S.em!='saver')autoSync()},180000);
setTimeout(()=>{if(LS.g('gok',0))autoSync()},2500);
setInterval(()=>{if(document.hidden||!S.panes.length)return;S.panes.forEach(p=>{p.meta.sec=(p.meta.sec||0)+15;if(p.meta.sec%60==0)save(p)});const days=LS.g('days',{}),k=dk(Date.now());days[k]=(days[k]||0)+15;LS.s('days',days)},15000);
loadLib();
